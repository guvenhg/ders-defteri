/* ============================================================
   PIN kilidi
   Amaç: yanlışlıkla silmeyi ve meraklı elleri engellemek.
   Verileri şifrelemez — cihazı eline alan biri tarayıcı
   araçlarıyla yine okuyabilir. Bunu ekranda da böyle söylüyoruz.
   ============================================================ */
let unlocked = false;

function hashPin(pin){
  const s = 'ders-defteri|'+pin;
  try{
    if(window.crypto && crypto.subtle && window.TextEncoder){
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s))
        .then(buf=> Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''))
        .catch(()=> weakHash(s));
    }
  }catch(e){}
  return Promise.resolve(weakHash(s));
}
function weakHash(s){
  let h=5381;
  for(let i=0;i<s.length;i++) h=(((h<<5)+h)+s.charCodeAt(i))>>>0;
  return 'w'+h.toString(16);
}

/* mode: 'unlock' | 'set' | 'off' */
function sheetPin(mode){
  let buf = '', first = '', step = (mode==='set') ? 1 : 0;

  const texts = {
    unlock:['Ayarlar kilitli','Devam etmek için PIN\'i gir'],
    off   :['Kilidi kaldır','Mevcut PIN\'i gir'],
    set1  :['Yeni PIN belirle','4 haneli bir sayı seç'],
    set2  :['PIN\'i doğrula','Aynı sayıyı bir daha gir']
  };

  function head(){
    if(mode==='set') return step===1 ? texts.set1 : texts.set2;
    return texts[mode];
  }
  function draw(){
    const h = head();
    $('#pin-title').textContent = h[0];
    $('#pin-sub').textContent   = h[1];
    $$('#pin-dots i').forEach((d,i)=> d.classList.toggle('on', i<buf.length));
  }
  function bad(msg){
    const dots = $('#pin-dots');
    dots.classList.add('is-bad');
    setTimeout(()=>{ dots.classList.remove('is-bad'); buf=''; draw(); }, 480);
    toast(msg);
  }

  openSheet(
    '<div class="pin">'+
      '<div class="pin-title" id="pin-title"></div>'+
      '<div class="pin-sub" id="pin-sub"></div>'+
      '<div class="pin-dots" id="pin-dots"><i></i><i></i><i></i><i></i></div>'+
      '<div class="pin-pad" id="pin-pad">'+
        [1,2,3,4,5,6,7,8,9].map(n=>'<button type="button" class="pin-key" data-k="'+n+'">'+n+'</button>').join('')+
        '<button type="button" class="pin-key is-flat" data-k="cancel">Vazgeç</button>'+
        '<button type="button" class="pin-key" data-k="0">0</button>'+
        '<button type="button" class="pin-key is-flat" data-k="del" aria-label="Sil">⌫</button>'+
      '</div>'+
      (mode==='unlock'
        ? '<button type="button" class="pin-cancel" id="pin-forgot">PIN\'i mi unuttun?</button>'
        : '')+
    '</div>'
  );
  draw();

  $('#pin-pad').onclick = e=>{
    const b = e.target.closest('[data-k]'); if(!b) return;
    const k = b.dataset.k;

    if(k==='cancel'){ closeSheet(); return; }
    if(k==='del'){ buf = buf.slice(0,-1); draw(); return; }
    if(buf.length>=4) return;

    buf += k;
    draw();
    if(buf.length<4) return;

    /* dört hane doldu */
    setTimeout(()=>{
      if(mode==='set'){
        if(step===1){ first=buf; buf=''; step=2; draw(); return; }
        if(buf!==first){ step=1; first=''; bad('PIN\'ler aynı değil, baştan'); return; }
        hashPin(buf).then(h=>{
          S.settings.pinHash = h; save();
          unlocked = true; closeSheet(); toast('Kilit açıldı — PIN belirlendi');
        });
        return;
      }
      hashPin(buf).then(h=>{
        if(h !== S.settings.pinHash){ bad('PIN yanlış'); return; }
        if(mode==='off'){
          delete S.settings.pinHash; save();
          unlocked = true; sheetSettings(); toast('Kilit kaldırıldı');
        } else {
          unlocked = true; sheetSettings();
        }
      });
    }, 120);
  };

  const fg = $('#pin-forgot');
  if(fg) fg.onclick = ()=>{
    openSheet(
      '<h2 class="sheet-h">PIN\'i unuttuysan</h2>'+
      '<div class="note" style="line-height:1.6">PIN yalnızca bu telefonda saklanıyor, bir yerden sorulup öğrenilemiyor. '+
      'Ayarlar\'a giremezsen uygulamanın geri kalanı normal çalışmaya devam eder — ders programı, ödevler, notlar, hepsi açık.<br><br>'+
      'Kilidi tamamen sıfırlamanın tek yolu Safari\'den bu sitenin verilerini silmek, o da defteri sıfırlar. '+
      'Bu yüzden ara sıra <b>Ayarlar → Yedek</b>\'ten kopya alıp bir yere kaydetmek önemli.</div>'+
      '<button class="btn btn-wide" id="pf-back" style="margin-top:14px">Geri</button>'
    );
    $('#pf-back').onclick = ()=> sheetPin('unlock');
  };
}

  else sheetSettings();

/* otomatik yedek listesi */
function fmtSnapWhen(ts){
  const d = new Date(ts), n = new Date();
  const gun = 86400000;
  const d0 = new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  const n0 = new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  const fark = Math.round((n0-d0)/gun);
  const saat = d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  if(fark===0) return 'Bugün '+saat;
  if(fark===1) return 'Dün '+saat;
  return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'})+' '+saat;
}
function renderSnapList(){
  const box = $('#fs-snaps'); if(!box) return;
  const list = snapList().slice().reverse();
  box.innerHTML = list.length
    ? list.map(s=>{
        let n = 0;
        try{ n = (JSON.parse(s.json).courses||[]).length; }catch(e){}
        return '<div class="snap-row">'+
          '<span class="snap-when">'+esc(fmtSnapWhen(s.at))+'</span>'+
          '<span class="snap-size">'+n+' ders</span>'+
          '<button class="chip tone-accent" data-snap="'+s.at+'">Geri dön</button>'+
        '</div>';
      }).join('')
    : '<div class="empty empty-flat"><div class="empty-p">Henüz otomatik yedek yok. '+
      'Veri girdikçe burada birikir.</div></div>';

  $$('[data-snap]', box).forEach(b=>{
    b.onclick = ()=>{
      if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Emin misin?'; return; }
      const at = Number(b.dataset.snap);
      if(snapRestore(at)){ closeSheet(); toast('Yedek geri yüklendi'); }
      else toast('Bu yedek okunamadı');
    };
  });
}
